
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Billed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  section {
    margin-bottom: 30px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #f4f4f4;
  }
  input[type="number"] {
    width: 60px;
    text-align: right;
  }
  .week-label {
    font-weight: bold;
  }
</style>
</head>
<body>

<section id="time-billed">
  <h2>Time Billed</h2>
  
  <!-- Week Entry Form -->
  <form id="billed-form">
    <label for="week-start">Week Starting (Monday):</label>
    <input type="date" id="week-start" name="week-start" required>
    <br><br>
    <label>Mon:</label> <input type="number" step="0.1" min="0" id="mon" required>
    <label>Tue:</label> <input type="number" step="0.1" min="0" id="tue" required>
    <label>Wed:</label> <input type="number" step="0.1" min="0" id="wed" required>
    <label>Thu:</label> <input type="number" step="0.1" min="0" id="thu" required>
    <label>Fri:</label> <input type="number" step="0.1" min="0" id="fri" required>
    <br><br>
    <button type="submit">Save Week</button>
  </form>

  <!-- Table of Saved Weeks -->
  <table id="billed-table">
    <thead>
      <tr>
        <th>Week</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added dynamically -->
    </tbody>
  </table>
</section>

<script>

const billedTableBody = document.querySelector('#billed-table tbody');
let weeks = [];

// Load saved weeks from localStorage on page load
window.addEventListener('load', () => {
  const savedWeeks = localStorage.getItem('billedWeeks');
  if (savedWeeks) {
    weeks = JSON.parse(savedWeeks);
    renderTable();
  }
});

document.getElementById('billed-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const weekStart = document.getElementById('week-start').value;
  const mon = parseFloat(document.getElementById('mon').value);
  const tue = parseFloat(document.getElementById('tue').value);
  const wed = parseFloat(document.getElementById('wed').value);
  const thu = parseFloat(document.getElementById('thu').value);
  const fri = parseFloat(document.getElementById('fri').value);

  if (!weekStart) return;

  // Check if week already exists
  if (weeks.some(w => w.weekStart === weekStart)) {
    alert('This week is already saved.');
    return;
  }

  // Save the week
  const newWeek = {
    weekStart: weekStart,
    days: { Mon: mon, Tue: tue, Wed: wed, Thu: thu, Fri: fri }
  };
  weeks.push(newWeek);

  // Sort weeks by date descending
  weeks.sort((a, b) => new Date(b.weekStart) - new Date(a.weekStart));

  // Save to localStorage
  localStorage.setItem('billedWeeks', JSON.stringify(weeks));

  renderTable();
  document.getElementById('billed-form').reset();
});

function renderTable() {
  billedTableBody.innerHTML = '';
  weeks.forEach((week, index) => {
    const row = document.createElement('tr');

    // Week label
    const weekCell = document.createElement('td');
    weekCell.textContent = week.weekStart;
    weekCell.classList.add('week-label');
    row.appendChild(weekCell);

    // Days cells
    let total = 0;
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(day => {
      const cell = document.createElement('td');
      const value = week.days[day];
      cell.textContent = value.toFixed(1);
      total += value;
      row.appendChild(cell);
    });

    // Weekly Total
    const totalCell = document.createElement('td');
    totalCell.textContent = total.toFixed(1);
    row.appendChild(totalCell);

    // Delete Button
    const actionCell = document.createElement('td');
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.style.backgroundColor = '#d9534f';
    deleteBtn.style.color = '#fff';
    deleteBtn.style.border = 'none';
    deleteBtn.style.padding = '5px 10px';
    deleteBtn.style.cursor = 'pointer';
    deleteBtn.addEventListener('click', () => {
      weeks.splice(index, 1);
      localStorage.setItem('billedWeeks', JSON.stringify(weeks));
      renderTable();
    });
    actionCell.appendChild(deleteBtn);
    row.appendChild(actionCell);

    billedTableBody.appendChild(row);
  });
}

</script>
</body>
</html>
