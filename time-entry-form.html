
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Date Entry</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
      line-height: 1.4;
    }
    .card {
      max-width: 840px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.35rem;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Time + Note side-by-side */
    .row-time-note {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;   /* align labels at the top */
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .time-field {
      flex: 1 1 280px;
      min-width: 240px;
    }
    .note-field {
      flex: 1 1 320px;
      min-width: 260px;
    }
    .time-field input[type="datetime-local"] {
      padding: 0.4rem;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }
    .note-field textarea {
      font: inherit;
      line-height: 1.3;
      padding: 0.4rem;
      width: 100%;
      box-sizing: border-box;
      resize: vertical; /* allow expand if needed */
      min-height: calc(1em * 1.3 * 2 + 0.8rem); /* approx two lines + padding */
      /* If you want fixed height exactly two lines:
         height: calc(1em * 1.3 * 2 + 0.8rem);
         resize: none; */
    }

    .spin-group {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .spin-group > button {
      appearance: none;
      background: #f5f5f5;
      border: none;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .spin-group > button:focus {
      outline: 2px solid #2684ff;
      outline-offset: -2px;
    }
    .spin-label {
      display: inline-flex;
      align-items: center;
      padding: 0 0.5rem;
      background: #fff;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
      font-size: 0.9rem;
      min-width: 4.5rem;
      justify-content: center;
    }
    .inline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .actions button {
      appearance: none;
      background: #2684ff;
      color: white;
      border: none;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .actions button.secondary {
      background: #e0e0e0;
      color: #222;
    }
    .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.5rem;
    }
    kbd {
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    /* History + grouping */
    .history {
      margin-top: 1.5rem;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .group {
      margin-top: 1rem;
      border-top: 1px solid #ddd;
      padding-top: 0.5rem;
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .group-title {
      margin: 0;
      font-size: 1.05rem;
    }
    .group-subtotal {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .history-list {
      list-style: none;
      padding-left: 0;
      margin: 0.5rem 0 0 0;
    }
    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
    }
    .history-item .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .note {
      color: #333;
      margin-top: 0.25rem;
    }
    .elapsed {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
      align-self: center;
    }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid transparent;
      margin-left: 0.35rem;
    }
    .billable-true {
      background: #dff0d8;
      color: #2e7d32;
      border-color: #b2d8b8;
    }
    .billable-false {
      background: #fdecea;
      color: #c62828;
      border-color: #f5c6c6;
    }
    .empty {
      color: #777;
      font-style: italic;
      margin-top: 0.5rem;
    }

    @media (pointer: coarse) {
      .spin-group > button { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="card" role="group" aria-label="Quick date entry">

    <!-- Time + Note side-by-side -->
    <div class="row-time-note">
      <!-- Left: Date & time -->
      <div class="field time-field">
        <label for="dt">Date &amp; time</label>
        <input id="dt" type="datetime-local" step="60" aria-describedby="kb-help" />
      </div>

      <!-- Right: Note (two lines tall) -->
      <div class="field note-field">
        <label for="note">Note</label>
        <textarea id="note" rows="2" placeholder="Add a note (optional)"></textarea>
      </div>
    </div>

    <!-- Hour/Minute spin buttons -->
    <div class="row">
      <!-- Hour spin -->
      <div class="spin-group" aria-label="Adjust hour">
        <button type="button" id="hour-dec" aria-label="Decrement hour">−</button>
        <span class="spin-label" id="hour-label" aria-live="polite">Hour: —</span>
        <button type="button" id="hour-inc" aria-label="Increment hour">+</button>
      </div>

      <!-- Minute spin -->
      <div class="spin-group" aria-label="Adjust minute">
        <button type="button" id="min-dec" aria-label="Decrement minute">−</button>
        <span class="spin-label" id="minute-label" aria-live="polite">Min: —</span>
        <button type="button" id="min-inc" aria-label="Increment minute">+</button>
      </div>

      <!-- Billable checkbox -->
      <label class="inline" for="billable" title="Billable by default" style="margin-left:auto;">
        <input id="billable" type="checkbox" checked />
        Billable
      </label>
    </div>

    <p class="hint" id="kb-help">
      Keyboard: <kbd>↑</kbd>/<kbd>↓</kbd> = ±1 minute,&nbsp;
      <kbd>Shift</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±1 hour,&nbsp;
      <kbd>Ctrl</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±5 minutes,&nbsp;
      <kbd>Home</kbd>/<kbd>End</kbd> = 00/59 minutes,&nbsp;
      <kbd>Enter</kbd> = save,&nbsp;
      <kbd>Ctrl</kbd>+<kbd>B</kbd> = toggle billable,&nbsp;
      <kbd>Ctrl</kbd>+<kbd>R</kbd> = reset to now,&nbsp;
      <kbd>N</kbd> = focus note
    </p>

    <div class="actions">
      <button type="button" id="reset-now" class="secondary">Reset to now</button>
      <button type="button" id="log-value">Save value</button>
      <button type="button" id="start-day" class="secondary" title="Save an entry with note 'Start of day.' and billable = FALSE">Start of day timehack</button>
      <button type="button" id="clear-history" class="secondary" title="Clear saved entries">Clear history</button>
    </div>

    <!-- History -->
    <div class="history" aria-live="polite">
      <div class="history-header">
        <h2 style="margin: 0;">Saved entries (newest first)</h2>
        <small id="count"></small>
      </div>
      <div id="groups-container"></div>
      <p id="history-empty" class="empty" hidden>No saved entries yet. Press <strong>Save value</strong> or hit <kbd>Enter</kbd>.</p>
    </div>
  </div>

  <script>
    // ===== Helpers for local-time datetime-local formatting =====
    function pad(n) { return String(n).padStart(2, '0'); }

    function toDatetimeLocalValue(date) {
      const y = date.getFullYear();
      const m = pad(date.getMonth() + 1);
      const d = pad(date.getDate());
      const h = pad(date.getHours());
      const min = pad(date.getMinutes());
      return `${y}-${m}-${d}T${h}:${min}`;
    }

    function fromDatetimeLocalValue(value) {
      const [datePart, timePart] = value.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mm] = timePart.split(':').map(Number);
      return new Date(y, (m - 1), d, hh, mm, 0, 0);
    }

    function getDateKey(datetimeStr) {
      return datetimeStr.split('T')[0]; // "YYYY-MM-DD"
    }

    function formatElapsed(ms) {
      const sign = ms < 0 ? '-' : '+';
      const abs = Math.abs(ms);
      const totalSeconds = Math.floor(abs / 1000);
      const hh = Math.floor(totalSeconds / 3600);
      const mm = Math.floor((totalSeconds % 3600) / 60);
      const ss = totalSeconds % 60;
      return `${sign}${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    const dtInput = document.getElementById('dt');
    const hourLabel = document.getElementById('hour-label');
    const minuteLabel = document.getElementById('minute-label');
    const noteInput = document.getElementById('note');      // textarea
    const billableInput = document.getElementById('billable');

    const groupsContainer = document.getElementById('groups-container');
    const historyEmpty = document.getElementById('history-empty');
    const countEl = document.getElementById('count');

    const STORAGE_KEY = 'quick-date-entry-history';

    function setNow() {
      const now = new Date();
      now.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(now);
      updateLabels(now);
    }

    function updateLabels(date) {
      hourLabel.textContent = `Hour: ${pad(date.getHours())}`;
      minuteLabel.textContent = `Min: ${pad(date.getMinutes())}`;
    }

    function getCurrentDate() {
      if (!dtInput.value) return new Date();
      return fromDatetimeLocalValue(dtInput.value);
    }

    function applyDelta({ hours = 0, minutes = 0 }) {
      const d = getCurrentDate();
      d.setMinutes(d.getMinutes() + minutes);
      d.setHours(d.getHours() + hours);
      d.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(d);
      updateLabels(d);
    }

    /**
     * History entry shape:
     * { datetime: "YYYY-MM-DDTHH:MM", note: string, billable: boolean }
     */
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        const normalized = parsed.map(item => {
          if (typeof item === 'string') {
            return { datetime: item, note: '', billable: true };
          } else {
            return {
              datetime: typeof item.datetime === 'string' ? item.datetime : '',
              note: typeof item.note === 'string' ? item.note : '',
              billable: item.billable !== undefined ? !!item.billable : true
            };
          }
        }).filter(e => e.datetime);
        return normalized;
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    // Helper: would the new entry become the oldest overall?
    function wouldBecomeOldest(newDatetimeStr, history) {
      const newMs = fromDatetimeLocalValue(newDatetimeStr).getTime();
      if (history.length === 0) return true;
      let minMs = Infinity;
      for (const h of history) {
        const ms = fromDatetimeLocalValue(h.datetime).getTime();
        if (ms < minMs) minMs = ms;
      }
      return newMs < minMs;
    }

    // ===== Rendering (newest-first, grouped by date, with billable subtotal rule) =====
    function renderHistory() {
      const history = loadHistory();

      const billableCount = history.filter(h => h.billable).length;
      countEl.textContent = history.length ? `${history.length} saved (${billableCount} billable)` : '';
      historyEmpty.hidden = history.length > 0;
      groupsContainer.innerHTML = '';
      if (!history.length) return;

      // 1) Sort entries newest-first
      const sorted = history
        .map(e => ({ ...e, dateObj: fromDatetimeLocalValue(e.datetime).getTime() }))
        .sort((a, b) => b.dateObj - a.dateObj);

      // 2) Augment with delta to immediate prior (next older) entry.
      //    Start-of-day entries DISPLAY zero elapsed regardless of the prior time.
      const augmented = sorted.map((e, i, arr) => {
        const prior = arr[i + 1];
        const deltaMs = prior ? (e.dateObj - prior.dateObj) : null;
        const isStartOfDay = (e.note === 'Start of day.' && !e.billable);
        const displayDeltaMs = isStartOfDay ? 0 : deltaMs;
        return { ...e, deltaMs, displayDeltaMs, isStartOfDay };
      });

      // 3) Daily subtotal:
      //    For each BILLABLE entry, add its gap to the subtotal of its OWN date,
      //    regardless of the prior entry's date or billable flag.
      const billableElapsedByDate = {};
      for (let i = 0; i < augmented.length; i++) {
        const cur = augmented[i];
        const prior = augmented[i + 1];
        if (!cur.billable) continue;
        if (prior == null || cur.deltaMs == null) continue; // no prior -> no gap
        const curKey = getDateKey(cur.datetime);
        billableElapsedByDate[curKey] = (billableElapsedByDate[curKey] || 0) + cur.deltaMs;
      }

      // 4) Group by date (DESC)
      const groupsMap = new Map();
      for (const item of augmented) {
        const key = getDateKey(item.datetime);
        if (!groupsMap.has(key)) groupsMap.set(key, []);
        groupsMap.get(key).push(item);
      }
      const groupKeysDesc = Array.from(groupsMap.keys()).sort((a, b) => new Date(b) - new Date(a));

      // 5) Render groups
      for (const key of groupKeysDesc) {
        const entries = groupsMap.get(key);

        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'group-header';

        const titleEl = document.createElement('h3');
        titleEl.className = 'group-title';
        titleEl.textContent = key;

        const subtotalEl = document.createElement('div');
        subtotalEl.className = 'group-subtotal';
        const ms = billableElapsedByDate[key] || 0;
        const elapsedText = ms ? formatElapsed(ms) : '—';
        subtotalEl.textContent = `Billable elapsed: ${elapsedText}`;

        headerDiv.appendChild(titleEl);
        headerDiv.appendChild(subtotalEl);

        const listEl = document.createElement('ul');
        listEl.className = 'history-list';

        for (const entry of entries) {
          const li = document.createElement('li');
          li.className = 'history-item';

          const left = document.createElement('div');
          const valueEl = document.createElement('div');
          valueEl.className = 'value';
          valueEl.textContent = entry.datetime;

          const billableEl = document.createElement('span');
          billableEl.className = 'pill ' + (entry.billable ? 'billable-true' : 'billable-false');
          billableEl.textContent = entry.billable ? '✓ Billable' : 'Non-billable';
          billableEl.title = entry.billable ? 'This entry is billable' : 'This entry is not billable';

          const valueRow = document.createElement('div');
          valueRow.appendChild(valueEl);
          valueRow.appendChild(billableEl);

          const noteEl = document.createElement('div');
          noteEl.className = 'note';
          noteEl.textContent = entry.note ? entry.note : '—';

          left.appendChild(valueRow);
          left.appendChild(noteEl);

          const elapsedEl = document.createElement('span');
          elapsedEl.className = 'elapsed';
          if (entry.displayDeltaMs === null) {
            elapsedEl.textContent = '—';
            elapsedEl.title = 'No prior entry';
          } else {
            elapsedEl.textContent = formatElapsed(entry.displayDeltaMs);
            elapsedEl.title = entry.isStartOfDay
              ? 'Start of day (elapsed forced to zero)'
              : 'Δ from prior saved entry';
          }

          li.appendChild(left);
          li.appendChild(elapsedEl);
          listEl.appendChild(li);
        }

        groupDiv.appendChild(headerDiv);
        groupDiv.appendChild(listEl);
        groupsContainer.appendChild(groupDiv);
      }
    }

    // ===== Save-time rule enforcement & entry creation =====
    function tryAppendEntry(entry) {
      const history = loadHistory();

      // Rule: If the entry would become the oldest overall AND is NOT "Start of day." (non-billable),
      // reject the save and raise an error. No ongoing checks; only at save time.
      const isStartOfDayEntry = (entry.note === 'Start of day.' && entry.billable === false);
      if (wouldBecomeOldest(entry.datetime, history) && !isStartOfDayEntry) {
        alert('Cannot save: the oldest entry must be the “Start of day.” marker (non-billable).');
        return false; // not saved
      }

      // Otherwise, save
      history.push(entry);
      saveHistory(history);
      renderHistory();
      return true; // saved
    }

    function appendCurrentToHistory() {
      const currentStr = dtInput.value;
      if (!currentStr) return;
      const entry = {
        datetime: currentStr,
        note: noteInput.value.trim(),
        billable: !!billableInput.checked
      };

      const saved = tryAppendEntry(entry);
      if (saved) {
        // Clear note after normal save
        noteInput.value = '';
      }
    }

    function addStartOfDayEntry() {
      const currentStr = dtInput.value;
      if (!currentStr) return;
      const entry = {
        datetime: currentStr,
        note: 'Start of day.',
        billable: false
      };
      // Save; this will pass the rule (SOD marker is allowed to be oldest)
      tryAppendEntry(entry);
      // Do not clear user's note for this timehack
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    // ===== Initialize =====
    setNow();
    renderHistory();

    // Buttons
    document.getElementById('hour-inc').addEventListener('click', () => applyDelta({ hours: 1 }));
    document.getElementById('hour-dec').addEventListener('click', () => applyDelta({ hours: -1 }));
    document.getElementById('min-inc').addEventListener('click', () => applyDelta({ minutes: 1 }));
    document.getElementById('min-dec').addEventListener('click', () => applyDelta({ minutes: -1 }));

    dtInput.addEventListener('input', () => updateLabels(getCurrentDate()));
    document.getElementById('reset-now').addEventListener('click', setNow);
    document.getElementById('log-value').addEventListener('click', () => appendCurrentToHistory());
    document.getElementById('start-day').addEventListener('click', () => addStartOfDayEntry());
    document.getElementById('clear-history').addEventListener('click', () => {
      if (confirm('Clear all saved entries?')) clearHistory();
    });

    // After changing the billable checkbox (click/touch), blur and move focus to note
    billableInput.addEventListener('change', () => {
      billableInput.blur();
      noteInput.focus();
    });

    // ===== Keyboard shortcuts (your chosen version) =====
    function handleKey(e) {
      const keyLower = e.key.toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey; // treat Cmd (macOS) like Ctrl
      const shift = e.shiftKey;

      // --- Time adjustments (always enabled) ---
      if (keyLower === 'arrowup') {
        e.preventDefault();
        if (shift) applyDelta({ hours: 1 });
        else if (ctrl) applyDelta({ minutes: 5 });
        else applyDelta({ minutes: 1 });
        return;
      }
      if (keyLower === 'arrowdown') {
        e.preventDefault();
        if (shift) applyDelta({ hours: -1 });
        else if (ctrl) applyDelta({ minutes: -5 });
        else applyDelta({ minutes: -1 });
        return;
      }
      if (keyLower === 'home') {
        e.preventDefault();
        const d = getCurrentDate();
        d.setMinutes(0, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
        return;
      }
      if (keyLower === 'end') {
        e.preventDefault();
        const d = getCurrentDate();
        d.setMinutes(59, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
        return;
      }

      // --- Enter saves (always enabled) ---
      if (keyLower === 'enter') {
        e.preventDefault();
        appendCurrentToHistory();
        return;
      }
      
      // --- Move Focus to Note field: Cannot use Ctrl+N because that opens a new brower window ---
      if (keyLower === 'n') {
        if (!(e.target === noteInput)) e.preventDefault();
        noteInput.focus();
        return;
      }

      // --- Alpha shortcuts: require Ctrl/Cmd ---
      if (ctrl) {
        if (keyLower === 'b') {
          e.preventDefault();
          billableInput.checked = !billableInput.checked;
          return;
        }
        if (keyLower === 'r') {
          e.preventDefault();
          setNow();
          return;
        }
      }
    }

    // Bind globally (and optionally to the datetime input)
    dtInput.addEventListener('keydown', handleKey);
    document.addEventListener('keydown', handleKey);
  </script>
</body>
</html>
