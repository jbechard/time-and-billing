
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Date Entry</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
      line-height: 1.4;
    }
    .card {
      max-width: 840px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="datetime-local"], input[type="text"] {
      padding: 0.4rem;
      font-size: 1rem;
      width: 100%;
      max-width: 320px;
    }
    .spin-group {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .spin-group > button {
      appearance: none;
      background: #f5f5f5;
      border: none;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .spin-group > button:focus {
      outline: 2px solid #2684ff;
      outline-offset: -2px;
    }
    .spin-label {
      display: inline-flex;
      align-items: center;
      padding: 0 0.5rem;
      background: #fff;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
      font-size: 0.9rem;
      min-width: 4.5rem;
      justify-content: center;
    }
    .inline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .actions button {
      appearance: none;
      background: #2684ff;
      color: white;
      border: none;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .actions button.secondary {
      background: #e0e0e0;
      color: #222;
    }
    .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.5rem;
    }
    kbd {
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    /* History + grouping */
    .history {
      margin-top: 1.5rem;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .group {
      margin-top: 1rem;
      border-top: 1px solid #ddd;
      padding-top: 0.5rem;
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .group-title {
      margin: 0;
      font-size: 1.05rem;
    }
    .group-subtotal {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .history-list {
      list-style: none;
      padding-left: 0;
      margin: 0.5rem 0 0 0;
    }
    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
    }
    .history-item .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .note {
      color: #333;
      margin-top: 0.25rem;
    }
    .elapsed {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
      align-self: center;
    }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid transparent;
      margin-left: 0.35rem;
    }
    .billable-true {
      background: #dff0d8;
      color: #2e7d32;
      border-color: #b2d8b8;
    }
    .billable-false {
      background: #fdecea;
      color: #c62828;
      border-color: #f5c6c6;
    }
    .empty {
      color: #777;
      font-style: italic;
      margin-top: 0.5rem;
    }

    @media (pointer: coarse) {
      .spin-group > button { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="card" role="group" aria-label="Quick date entry">
    <label for="dt">Date &amp; time</label>
    <div class="row">
      <input id="dt" type="datetime-local" step="60" aria-describedby="kb-help" />
    </div>

    <div class="row" style="margin-top: 0.75rem;">
      <!-- Hour spin -->
      <div class="spin-group" aria-label="Adjust hour">
        <button type="button" id="hour-dec" aria-label="Decrement hour">−</button>
        <span class="spin-label" id="hour-label" aria-live="polite">Hour: —</span>
        <button type="button" id="hour-inc" aria-label="Increment hour">+</button>
      </div>

      <!-- Minute spin -->
      <div class="spin-group" aria-label="Adjust minute">
        <button type="button" id="min-dec" aria-label="Decrement minute">−</button>
        <span class="spin-label" id="minute-label" aria-live="polite">Min: —</span>
        <button type="button" id="min-inc" aria-label="Increment minute">+</button>
      </div>
    </div>

    <!-- Note and Billable -->
    <div class="row" style="margin-top: 0.75rem;">
      <div class="inline" style="flex: 1 1 320px;">
        <label for="note" style="margin:0;">Note</label>
      </div>
      <input id="note" type="text" placeholder="Add a note (optional)" />
      <label class="inline" for="billable" title="Billable by default">
        <input id="billable" type="checkbox" checked />
        Billable
      </label>
    </div>

    <p class="hint" id="kb-help">
      Keyboard: <kbd>↑</kbd>/<kbd>↓</kbd> = ±1 minute,&nbsp;
      <kbd>Shift</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±1 hour,&nbsp;
      <kbd>Ctrl</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±5 minutes,&nbsp;
      <kbd>Home</kbd>/<kbd>End</kbd> = 00/59 minutes,&nbsp;
      <kbd>R</kbd> = reset to now,&nbsp;
      <kbd>Enter</kbd> = save (works in note field),&nbsp;
      <kbd>B</kbd> = toggle billable,&nbsp;
      <kbd>N</kbd> = focus note
    </p>

    <div class="actions">
      <button type="button" id="reset-now" class="secondary">Reset to now</button>
      <button type="button" id="log-value">Save value</button>
      <button type="button" id="clear-history" class="secondary" title="Clear saved entries">Clear history</button>
    </div>

    <!-- History -->
    <div class="history" aria-live="polite">
      <div class="history-header">
        <h2 style="margin: 0;">Saved entries (newest first)</h2>
        <small id="count"></small>
      </div>
      <div id="groups-container"></div>
      <p id="history-empty" class="empty" hidden>No saved entries yet. Press <strong>Save value</strong> or hit <kbd>Enter</kbd>.</p>
    </div>
  </div>

  <script>
    // ===== Helpers for local-time datetime-local formatting =====
    function pad(n) { return String(n).padStart(2, '0'); }

    function toDatetimeLocalValue(date) {
      const y = date.getFullYear();
      const m = pad(date.getMonth() + 1);
      const d = pad(date.getDate());
      const h = pad(date.getHours());
      const min = pad(date.getMinutes());
      return `${y}-${m}-${d}T${h}:${min}`;
    }

    function fromDatetimeLocalValue(value) {
      const [datePart, timePart] = value.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mm] = timePart.split(':').map(Number);
      return new Date(y, (m - 1), d, hh, mm, 0, 0);
    }

    function getDateKey(datetimeStr) {
      // Returns "YYYY-MM-DD" part
      return datetimeStr.split('T')[0];
    }

    function formatElapsed(ms) {
      // Format as +HH:MM:SS (supports >24h)
      const sign = ms < 0 ? '-' : '+';
      const abs = Math.abs(ms);
      const totalSeconds = Math.floor(abs / 1000);
      const hh = Math.floor(totalSeconds / 3600);
      const mm = Math.floor((totalSeconds % 3600) / 60);
      const ss = totalSeconds % 60;
      return `${sign}${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    const dtInput = document.getElementById('dt');
    const hourLabel = document.getElementById('hour-label');
    const minuteLabel = document.getElementById('minute-label');
    const noteInput = document.getElementById('note');
    const billableInput = document.getElementById('billable');

    const groupsContainer = document.getElementById('groups-container');
    const historyEmpty = document.getElementById('history-empty');
    const countEl = document.getElementById('count');

    const STORAGE_KEY = 'quick-date-entry-history';

    function setNow() {
      const now = new Date();
      now.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(now);
      updateLabels(now);
    }

    function updateLabels(date) {
      hourLabel.textContent = `Hour: ${pad(date.getHours())}`;
      minuteLabel.textContent = `Min: ${pad(date.getMinutes())}`;
    }

    function getCurrentDate() {
      if (!dtInput.value) return new Date();
      return fromDatetimeLocalValue(dtInput.value);
    }

    function applyDelta({ hours = 0, minutes = 0 }) {
      const d = getCurrentDate();
      d.setMinutes(d.getMinutes() + minutes);
      d.setHours(d.getHours() + hours);
      d.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(d);
      updateLabels(d);
    }

    // ===== History persistence & rendering =====
    /**
     * History entry shape:
     * { datetime: "YYYY-MM-DDTHH:MM", note: string, billable: boolean }
     */
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        // Migrate old string-only entries: assume billable true and empty note
        const normalized = parsed.map(item => {
          if (typeof item === 'string') {
            return { datetime: item, note: '', billable: true };
          } else {
            return {
              datetime: typeof item.datetime === 'string' ? item.datetime : '',
              note: typeof item.note === 'string' ? item.note : '',
              billable: item.billable !== undefined ? !!item.billable : true
            };
          }
        }).filter(e => e.datetime);
        return normalized;
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function renderHistory() {
      const history = loadHistory();

      // Update header counts
      const billableCount = history.filter(h => h.billable).length;
      countEl.textContent = history.length ? `${history.length} saved (${billableCount} billable)` : '';
      historyEmpty.hidden = history.length > 0;
      groupsContainer.innerHTML = '';
      if (!history.length) return;

      // 1) Sort all entries by datetime DESC (newest first)
      const sorted = history
        .map(e => ({ ...e, dateObj: fromDatetimeLocalValue(e.datetime).getTime() }))
        .sort((a, b) => b.dateObj - a.dateObj);

      // 2) Compute per-entry elapsed to "prior" (next older entry in overall list)
      //    For last (oldest) entry, deltaMs = null
      const augmented = sorted.map((e, i, arr) => {
        const nextOlder = arr[i + 1];
        const deltaMs = nextOlder ? (e.dateObj - nextOlder.dateObj) : null;
        return { ...e, deltaMs };
      });

      // 3) Group by date (YYYY-MM-DD), preserve DESC date order, entries within group DESC
      const groupsMap = new Map(); // key -> array of augmented entries
      for (const item of augmented) {
        const key = getDateKey(item.datetime);
        if (!groupsMap.has(key)) groupsMap.set(key, []);
        groupsMap.get(key).push(item);
      }
      const groupKeysDesc = Array.from(groupsMap.keys()).sort((a, b) => {
        // Compare date strings as actual dates
        return new Date(b) - new Date(a);
      });

      // 4) Render groups with subtotals (entries count, billable count, total elapsed within date)
      for (const key of groupKeysDesc) {
        const entries = groupsMap.get(key);

        // Subtotals: count, billable count, total elapsed within the same date
        const totalCount = entries.length;
        const billableCountGroup = entries.filter(e => e.billable).length;

        // Sum deltaMs only when the "prior" entry (next older) is in the same date
        let totalElapsedMs = 0;
        for (let i = 0; i < entries.length; i++) {
          const current = entries[i];
          // Find the next older entry overall (we must check the global augmented array)
          // We already have current.deltaMs, but its "prior" might belong to another date.
          // Determine if the immediate prior is in the same date:
          const priorDateKeySame = (() => {
            // To know if immediate prior is in same date, we need to locate current in augmented array.
            const idx = augmented.findIndex(x =>
              x.datetime === current.datetime && x.note === current.note && x.billable === current.billable && x.dateObj === current.dateObj
            );
            const prior = augmented[idx + 1];
            return prior ? (getDateKey(prior.datetime) === key) : false;
          })();

          if (current.deltaMs != null && priorDateKeySame) {
            totalElapsedMs += current.deltaMs;
          }
        }

        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'group-header';

        const titleEl = document.createElement('h3');
        titleEl.className = 'group-title';
        titleEl.textContent = key;

        const subtotalEl = document.createElement('div');
        subtotalEl.className = 'group-subtotal';
        const elapsedText = totalElapsedMs ? formatElapsed(totalElapsedMs) : '—';
        subtotalEl.textContent = `Subtotal: ${totalCount} entries, ${billableCountGroup} billable, elapsed ${elapsedText}`;

        headerDiv.appendChild(titleEl);
        headerDiv.appendChild(subtotalEl);

        const listEl = document.createElement('ul');
        listEl.className = 'history-list';

        // Render entries (DESC within group)
        for (const entry of entries) {
          const li = document.createElement('li');
          li.className = 'history-item';

          // Left: datetime + pill + note
          const left = document.createElement('div');

          const valueEl = document.createElement('div');
          valueEl.className = 'value';
          valueEl.textContent = entry.datetime;

          const billableEl = document.createElement('span');
          billableEl.className = 'pill ' + (entry.billable ? 'billable-true' : 'billable-false');
          billableEl.textContent = entry.billable ? '✓ Billable' : 'Non-billable';
          billableEl.title = entry.billable ? 'This entry is billable' : 'This entry is not billable';

          const valueRow = document.createElement('div');
          valueRow.appendChild(valueEl);
          valueRow.appendChild(billableEl);

          const noteEl = document.createElement('div');
          noteEl.className = 'note';
          noteEl.textContent = entry.note ? entry.note : '—';

          left.appendChild(valueRow);
          left.appendChild(noteEl);

          // Right: elapsed from prior saved value (next older overall)
          const elapsedEl = document.createElement('span');
          elapsedEl.className = 'elapsed';
          if (entry.deltaMs != null) {
            elapsedEl.textContent = formatElapsed(entry.deltaMs);
            elapsedEl.title = `Δ from prior saved entry`;
          } else {
            elapsedEl.textContent = '—';
            elapsedEl.title = 'No prior entry';
          }

          li.appendChild(left);
          li.appendChild(elapsedEl);
          listEl.appendChild(li);
        }

        groupDiv.appendChild(headerDiv);
        groupDiv.appendChild(listEl);
        groupsContainer.appendChild(groupDiv);
      }
    }

    function appendCurrentToHistory() {
      const currentStr = dtInput.value;
      if (!currentStr) return;
      const entry = {
        datetime: currentStr,
        note: noteInput.value.trim(),
        billable: !!billableInput.checked
      };
      const history = loadHistory();
      history.push(entry);
      saveHistory(history);
      renderHistory();

      // Clear the note field after saving (as requested)
      noteInput.value = '';
      // Keep billable as-is (defaults to checked, but don't reset user toggles)
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    // ===== Initialize =====
    setNow();
    renderHistory();

    // Buttons
    document.getElementById('hour-inc').addEventListener('click', () => applyDelta({ hours: 1 }));
    document.getElementById('hour-dec').addEventListener('click', () => applyDelta({ hours: -1 }));
    document.getElementById('min-inc').addEventListener('click', () => applyDelta({ minutes: 1 }));
    document.getElementById('min-dec').addEventListener('click', () => applyDelta({ minutes: -1 }));

    dtInput.addEventListener('input', () => updateLabels(getCurrentDate()));
    document.getElementById('reset-now').addEventListener('click', setNow);
    document.getElementById('log-value').addEventListener('click', () => appendCurrentToHistory());
    document.getElementById('clear-history').addEventListener('click', () => {
      if (confirm('Clear all saved entries?')) clearHistory();
    });

    // ===== Keyboard shortcuts =====
    function handleKey(e) {
      const key = e.key;
      const ctrl = e.ctrlKey || e.metaKey; // treat Cmd on macOS like Ctrl
      const shift = e.shiftKey;

      const keyLower = key.toLowerCase();
      const handledKeys = ['arrowup','arrowdown','home','end','enter','r','b','n'];

      // If target is the note field, only handle Enter (so typing notes works as expected)
      if (e.target === noteInput) {
        if (keyLower === 'enter') {
          e.preventDefault();
          appendCurrentToHistory();
        }
        return;
      }

      // If typing in other text fields (not datetime), ignore
      const target = e.target;
      const isTextField =
        target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target.isContentEditable;
      if (isTextField && target !== dtInput) return;

      // Only act on keys we use
      if (!handledKeys.includes(keyLower)) return;
      e.preventDefault();

      if (keyLower === 'arrowup') {
        if (shift) applyDelta({ hours: 1 });
        else if (ctrl) applyDelta({ minutes: 5 });
        else applyDelta({ minutes: 1 });
      } else if (keyLower === 'arrowdown') {
        if (shift) applyDelta({ hours: -1 });
        else if (ctrl) applyDelta({ minutes: -5 });
        else applyDelta({ minutes: -1 });
      } else if (keyLower === 'home') {
        const d = getCurrentDate();
        d.setMinutes(0, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
      } else if (keyLower === 'end') {
        const d = getCurrentDate();
        d.setMinutes(59, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
      } else if (keyLower === 'r') {
        setNow();
      } else if (keyLower === 'enter') {
        appendCurrentToHistory();
      } else if (keyLower === 'b') {
        billableInput.checked = !billableInput.checked;
      } else if (keyLower === 'n') {
        noteInput.focus();
      }
    }

    // Bind at both input and document level
    dtInput.addEventListener('keydown', handleKey);
    document.addEventListener('keydown', handleKey);
  </script>
</body>
</html>
