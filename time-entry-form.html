
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Date Entry</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
      line-height: 1.4;
    }
    .card {
      max-width: 720px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="datetime-local"] {
      padding: 0.4rem;
      font-size: 1rem;
      width: 100%;
      max-width: 280px;
    }
    .spin-group {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .spin-group > button {
      appearance: none;
      background: #f5f5f5;
      border: none;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .spin-group > button:focus {
      outline: 2px solid #2684ff;
      outline-offset: -2px;
    }
    .spin-label {
      display: inline-flex;
      align-items: center;
      padding: 0 0.5rem;
      background: #fff;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
      font-size: 0.9rem;
      min-width: 4.5rem;
      justify-content: center;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .actions button {
      appearance: none;
      background: #2684ff;
      color: white;
      border: none;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .actions button.secondary {
      background: #e0e0e0;
      color: #222;
    }
    .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.5rem;
    }
    kbd {
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    /* History styles */
    .history {
      margin-top: 1.5rem;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-list {
      list-style: none;
      padding-left: 0;
      margin: 0.5rem 0 0 0;
      border-top: 1px solid #ddd;
    }
    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
    }
    .history-item .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .history-item .elapsed {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .empty {
      color: #777;
      font-style: italic;
      margin-top: 0.5rem;
    }
    @media (pointer: coarse) {
      .spin-group > button { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="card" role="group" aria-label="Quick date entry">
    <label for="dt">Date &amp; time</label>
    <div class="row">
      <input id="dt" type="datetime-local" step="60" aria-describedby="kb-help" />
    </div>

    <div class="row" style="margin-top: 0.75rem;">
      <!-- Hour spin -->
      <div class="spin-group" aria-label="Adjust hour">
        <button type="button" id="hour-dec" aria-label="Decrement hour">−</button>
        <span class="spin-label" id="hour-label" aria-live="polite">Hour: —</span>
        <button type="button" id="hour-inc" aria-label="Increment hour">+</button>
      </div>

      <!-- Minute spin -->
      <div class="spin-group" aria-label="Adjust minute">
        <button type="button" id="min-dec" aria-label="Decrement minute">−</button>
        <span class="spin-label" id="minute-label" aria-live="polite">Min: —</span>
        <button type="button" id="min-inc" aria-label="Increment minute">+</button>
      </div>
    </div>

    <p class="hint" id="kb-help">
      Keyboard: <kbd>↑</kbd>/<kbd>↓</kbd> = ±1 minute,&nbsp;
      <kbd>Shift</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±1 hour,&nbsp;
      <kbd>Ctrl</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> = ±5 minutes,&nbsp;
      <kbd>Home</kbd>/<kbd>End</kbd> = 00/59 minutes,&nbsp;
      <kbd>R</kbd> = reset to now,&nbsp;
      <kbd>Enter</kbd> = save value
    </p>

    <div class="actions">
      <button type="button" id="reset-now" class="secondary">Reset to now</button>
      <button type="button" id="log-value">Save value</button>
      <button type="button" id="clear-history" class="secondary" title="Clear saved values">Clear history</button>
    </div>

    <!-- History -->
    <div class="history" aria-live="polite">
      <div class="history-header">
        <h2 style="margin: 0;">Saved values</h2>
        <small id="count"></small>
      </div>
      <ul id="history-list" class="history-list" aria-label="Saved date/time values"></ul>
      <p id="history-empty" class="empty" hidden>No saved values yet. Press <strong>Save value</strong> or hit <kbd>Enter</kbd>.</p>
    </div>
  </div>

  <script>
    // ===== Helpers for local-time datetime-local formatting =====
    function pad(n) { return String(n).padStart(2, '0'); }

    function toDatetimeLocalValue(date) {
      const y = date.getFullYear();
      const m = pad(date.getMonth() + 1);
      const d = pad(date.getDate());
      const h = pad(date.getHours());
      const min = pad(date.getMinutes());
      return `${y}-${m}-${d}T${h}:${min}`;
    }

    function fromDatetimeLocalValue(value) {
      const [datePart, timePart] = value.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mm] = timePart.split(':').map(Number);
      return new Date(y, (m - 1), d, hh, mm, 0, 0);
    }

    function formatElapsed(ms) {
      // Format as +HH:MM:SS (supports >24h)
      const sign = ms < 0 ? '-' : '+';
      const abs = Math.abs(ms);
      const totalSeconds = Math.floor(abs / 1000);
      const hh = Math.floor(totalSeconds / 3600);
      const mm = Math.floor((totalSeconds % 3600) / 60);
      const ss = totalSeconds % 60;
      return `${sign}${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    const dtInput = document.getElementById('dt');
    const hourLabel = document.getElementById('hour-label');
    const minuteLabel = document.getElementById('minute-label');
    const historyList = document.getElementById('history-list');
    const historyEmpty = document.getElementById('history-empty');
    const countEl = document.getElementById('count');

    const STORAGE_KEY = 'quick-date-entry-history';

    function setNow() {
      const now = new Date();
      now.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(now);
      updateLabels(now);
    }

    function updateLabels(date) {
      hourLabel.textContent = `Hour: ${pad(date.getHours())}`;
      minuteLabel.textContent = `Min: ${pad(date.getMinutes())}`;
    }

    function getCurrentDate() {
      if (!dtInput.value) return new Date();
      return fromDatetimeLocalValue(dtInput.value);
    }

    function applyDelta({ hours = 0, minutes = 0 }) {
      const d = getCurrentDate();
      d.setMinutes(d.getMinutes() + minutes);
      d.setHours(d.getHours() + hours);
      d.setSeconds(0, 0);
      dtInput.value = toDatetimeLocalValue(d);
      updateLabels(d);
    }

    // ===== History persistence & rendering =====
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        // Normalize: expect array of ISO-like strings or numbers
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function renderHistory() {
      const history = loadHistory();
      historyList.innerHTML = '';

      countEl.textContent = history.length ? `${history.length} saved` : '';
      historyEmpty.hidden = history.length > 0;

      if (!history.length) return;

      // We will display in chronological order (oldest first)
      for (let i = 0; i < history.length; i++) {
        const valueStr = history[i]; // "YYYY-MM-DDTHH:MM"
        const current = fromDatetimeLocalValue(valueStr);
        const prev = i > 0 ? fromDatetimeLocalValue(history[i - 1]) : null;
        const li = document.createElement('li');
        li.className = 'history-item';

        const valueEl = document.createElement('span');
        valueEl.className = 'value';
        valueEl.textContent = valueStr;

        const elapsedEl = document.createElement('span');
        elapsedEl.className = 'elapsed';
        if (prev) {
          const deltaMs = current - prev;
          elapsedEl.textContent = formatElapsed(deltaMs);
          elapsedEl.title = `Δ from previous: ${formatElapsed(deltaMs)} (${prev.toLocaleString()})`;
        } else {
          elapsedEl.textContent = '—'; // first entry has no previous
          elapsedEl.title = 'No previous value';
        }

        li.appendChild(valueEl);
        li.appendChild(elapsedEl);
        historyList.appendChild(li);
      }
    }

    function appendCurrentToHistory() {
      const currentStr = dtInput.value;
      if (!currentStr) return;
      const history = loadHistory();
      history.push(currentStr);
      saveHistory(history);
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    // ===== Initialize =====
    setNow();
    renderHistory();

    // Button wiring
    document.getElementById('hour-inc').addEventListener('click', () => applyDelta({ hours: 1 }));
    document.getElementById('hour-dec').addEventListener('click', () => applyDelta({ hours: -1 }));
    document.getElementById('min-inc').addEventListener('click', () => applyDelta({ minutes: 1 }));
    document.getElementById('min-dec').addEventListener('click', () => applyDelta({ minutes: -1 }));

    dtInput.addEventListener('input', () => updateLabels(getCurrentDate()));
    document.getElementById('reset-now').addEventListener('click', setNow);

    document.getElementById('log-value').addEventListener('click', () => {
      appendCurrentToHistory();
    });

    document.getElementById('clear-history').addEventListener('click', () => {
      if (confirm('Clear all saved values?')) clearHistory();
    });

    // ===== Keyboard shortcuts =====
    function handleKey(e) {
      const key = e.key;
      const ctrl = e.ctrlKey || e.metaKey; // treat Cmd on macOS like Ctrl
      const shift = e.shiftKey;

      // Only act on keys we use; otherwise let native behavior through
      if (['ArrowUp','ArrowDown','Home','End','Enter'].includes(key) || key.toLowerCase() === 'r') {
        e.preventDefault();
      } else {
        return; // ignore other keys
      }

      // Compute deltas
      if (key === 'ArrowUp') {
        if (shift) applyDelta({ hours: 1 });
        else if (ctrl) applyDelta({ minutes: 5 });
        else applyDelta({ minutes: 1 });
      } else if (key === 'ArrowDown') {
        if (shift) applyDelta({ hours: -1 });
        else if (ctrl) applyDelta({ minutes: -5 });
        else applyDelta({ minutes: -1 });
      } else if (key === 'Home') {
        const d = getCurrentDate();
        d.setMinutes(0, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
      } else if (key === 'End') {
        const d = getCurrentDate();
        d.setMinutes(59, 0, 0);
        dtInput.value = toDatetimeLocalValue(d);
        updateLabels(d);
      } else if (key.toLowerCase() === 'r') {
        setNow();
      } else if (key === 'Enter') {
        // Save value
        appendCurrentToHistory();
      }
    }

    // Bind at both input and document level so it works even when the input isn't focused
    dtInput.addEventListener('keydown', handleKey);
    document.addEventListener('keydown', (e) => {
      // Avoid interfering with typing inside other inputs
      const target = e.target;
      const isTextField =
        target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target.isContentEditable;
      if (isTextField && target !== dtInput) return;
      handleKey(e);
    });
  </script>
</body>
</html>
``
