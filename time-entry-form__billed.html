
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Worked & Time Billed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  .container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .section {
    flex: 1;
    border: 1px solid #ccc;
    padding: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    background: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #f4f4f4;
  }
  input[type="number"], input[type="text"], input[type="datetime-local"] {
    margin: 5px;
  }
  .week-label {
    font-weight: bold;
  }
  button {
    cursor: pointer;
    margin: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- LEFT: Time Worked -->
  <div class="section" id="time-worked">
    <h2>Quick Time Entry</h2>
    <form id="worked-form">
      <label>Date & Time:</label>
      <input type="datetime-local" id="worked-datetime" required>
      <br>
      <label>Hours:</label>
      <input type="number" id="worked-hours" step="1" min="0" value="0">
      <label>Minutes:</label>
      <input type="number" id="worked-minutes" step="1" min="0" max="59" value="0">
      <br>
      <label>Note:</label>
      <input type="text" id="worked-note">
      <br>
      <label><input type="checkbox" id="worked-billable"> Billable</label>
      <br><br>
      <button type="button" id="reset-now">Reset to now</button>
      <button type="submit">Save value</button>
      <button type="button" id="clear-history">Clear history</button>
      <button type="button" id="export-csv">Export CSV</button>
    </form>
    <h3>Saved entries (newest first)</h3>
    <ul id="worked-entries"></ul>
  </div>

  <!-- RIGHT: Time Billed -->
  <div class="section" id="time-billed">
    <h2>Time Billed</h2>
    <form id="billed-form">
      <label for="week-start">Week Starting (Monday):</label>
      <input type="date" id="week-start" required>
      <br><br>
      <label>Mon:</label> <input type="number" step="0.1" min="0" id="mon" required>
      <label>Tue:</label> <input type="number" step="0.1" min="0" id="tue" required>
      <label>Wed:</label> <input type="number" step="0.1" min="0" id="wed" required>
      <label>Thu:</label> <input type="number" step="0.1" min="0" id="thu" required>
      <label>Fri:</label> <input type="number" step="0.1" min="0" id="fri" required>
      <br><br>
      <button type="submit">Save Week</button>
    </form>

    <table id="billed-table">
      <thead>
        <tr>
          <th>Week</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
/* ---------------- TIME WORKED ---------------- */
const workedEntriesList = document.getElementById('worked-entries');
let workedEntries = JSON.parse(localStorage.getItem('workedEntries')) || [];

function renderWorkedEntries() {
  workedEntriesList.innerHTML = '';
  workedEntries.forEach((entry, index) => {
    const li = document.createElement('li');
    li.textContent = `${entry.datetime} | ${entry.hours}h ${entry.minutes}m | ${entry.note} | ${entry.billable ? 'Billable' : 'Non-billable'}`;
    workedEntriesList.appendChild(li);
  });
}

document.getElementById('worked-form').addEventListener('submit', e => {
  e.preventDefault();
  const datetime = document.getElementById('worked-datetime').value;
  const hours = parseInt(document.getElementById('worked-hours').value);
  const minutes = parseInt(document.getElementById('worked-minutes').value);
  const note = document.getElementById('worked-note').value;
  const billable = document.getElementById('worked-billable').checked;

  workedEntries.unshift({ datetime, hours, minutes, note, billable });
  localStorage.setItem('workedEntries', JSON.stringify(workedEntries));
  renderWorkedEntries();
  e.target.reset();
});

document.getElementById('reset-now').addEventListener('click', () => {
  document.getElementById('worked-datetime').value = new Date().toISOString().slice(0,16);
});

document.getElementById('clear-history').addEventListener('click', () => {
  if (confirm('Clear all worked entries?')) {
    workedEntries = [];
    localStorage.removeItem('workedEntries');
    renderWorkedEntries();
  }
});

document.getElementById('export-csv').addEventListener('click', () => {
  let csv = 'DateTime,Hours,Minutes,Note,Billable\n';
  workedEntries.forEach(e => {
    csv += `${e.datetime},${e.hours},${e.minutes},${e.note},${e.billable}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'worked_entries.csv';
  a.click();
});

renderWorkedEntries();

/* ---------------- TIME BILLED ---------------- */
const billedTableBody = document.querySelector('#billed-table tbody');
let weeks = JSON.parse(localStorage.getItem('billedWeeks')) || [];

function renderTable() {
  billedTableBody.innerHTML = '';
  weeks.forEach((week, index) => {
    const row = document.createElement('tr');
    const weekCell = document.createElement('td');
    weekCell.textContent = week.weekStart;
    row.appendChild(weekCell);

    let total = 0;
    ['Mon','Tue','Wed','Thu','Fri'].forEach(day => {
      const cell = document.createElement('td');
      const value = week.days[day];
      cell.textContent = value.toFixed(1);
      total += value;
      row.appendChild(cell);
    });

    const totalCell = document.createElement('td');
    totalCell.textContent = total.toFixed(1);
    row.appendChild(totalCell);

    const actionCell = document.createElement('td');
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.style.backgroundColor = '#d9534f';
    deleteBtn.style.color = '#fff';
    deleteBtn.addEventListener('click', () => {
      weeks.splice(index, 1);
      localStorage.setItem('billedWeeks', JSON.stringify(weeks));
      renderTable();
    });
    actionCell.appendChild(deleteBtn);
    row.appendChild(actionCell);

    billedTableBody.appendChild(row);
  });
}

document.getElementById('billed-form').addEventListener('submit', e => {
  e.preventDefault();
  const weekStart = document.getElementById('week-start').value;
  const mon = parseFloat(document.getElementById('mon').value);
  const tue = parseFloat(document.getElementById('tue').value);
  const wed = parseFloat(document.getElementById('wed').value);
  const thu = parseFloat(document.getElementById('thu').value);
  const fri = parseFloat(document.getElementById('fri').value);

  if (weeks.some(w => w.weekStart === weekStart)) {
    alert('This week is already saved.');
    return;
  }

  const newWeek = { weekStart, days: { Mon: mon, Tue: tue, Wed: wed, Thu: thu, Fri: fri } };
  weeks.push(newWeek);
  weeks.sort((a,b) => new Date(b.weekStart) - new Date(a.weekStart));
  localStorage.setItem('billedWeeks', JSON.stringify(weeks));
  renderTable();
  e.target.reset();
});

renderTable();


// Keyboard shortcuts for Time Worked
document.addEventListener('keydown', (e) => {
  const hoursInput = document.getElementById('worked-hours');
  const minutesInput = document.getElementById('worked-minutes');
  const noteInput = document.getElementById('worked-note');
  const billableCheckbox = document.getElementById('worked-billable');

  let hours = parseInt(hoursInput.value) || 0;
  let minutes = parseInt(minutesInput.value) || 0;

  // Arrow keys for minute/hour adjustments
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const direction = e.key === 'ArrowUp' ? 1 : -1;

    if (e.shiftKey) {
      // Shift: ±1 hour
      hours += direction;
    } else if (e.ctrlKey) {
      // Ctrl: ±5 minutes
      minutes += direction * 5;
    } else {
      // Default: ±1 minute
      minutes += direction;
    }

    // Normalize minutes and hours
    if (minutes >= 60) {
      hours += Math.floor(minutes / 60);
      minutes = minutes % 60;
    } else if (minutes < 0) {
      hours -= Math.ceil(Math.abs(minutes) / 60);
      minutes = (minutes % 60 + 60) % 60;
    }

    if (hours < 0) hours = 0;

    hoursInput.value = hours;
    minutesInput.value = minutes;
  }

  // Home/End for minutes
  if (e.key === 'Home') {
    e.preventDefault();
    minutesInput.value = 0;
  }
  if (e.key === 'End') {
    e.preventDefault();
    minutesInput.value = 59;
  }

  // Enter to save
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('worked-form').dispatchEvent(new Event('submit'));
  }

  // Ctrl+B toggle billable
  if (e.ctrlKey && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    billableCheckbox.checked = !billableCheckbox.checked;
  }

  // Ctrl+R reset to now
  if (e.ctrlKey && e.key.toLowerCase() === 'r') {
    e.preventDefault();
    document.getElementById('worked-datetime').value = new Date().toISOString().slice(0,16);
  }

  // N to focus note
  if (e.key.toLowerCase() === 'n') {
    e.preventDefault();
    noteInput.focus();
  }
});

</script>

</body>
</html>
